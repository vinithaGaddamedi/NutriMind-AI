[pytest]
addopts = -n auto --html=reports/report.html --alluredir=reports/allure-results --video=retain-on-failure --tracing=retain-on-failure --screenshot=only-on-failure
markers =
    ui: End-to-end Playwright UI automation tests
    api: FastAPI REST endpoint test suite
    deepeval: DeepEval AI model quality evaluation benchmarks
    agentic: Agentic QA framework tests
