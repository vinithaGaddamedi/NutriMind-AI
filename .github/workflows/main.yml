name: NutriMind CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install playwright pytest pytest-playwright requests allure-pytest
        playwright install chromium

    - name: Start Backend API
      run: |
        cd backend
        uvicorn main:app &
        sleep 5

    - name: Run API Tests
      run: |
        cd automation
        pytest api_tests/tests/ --alluredir=allure-results

    # Node setup and UI tests could follow here
    # - name: Start Frontend
    #   run: |
    #     cd web-app
    #     npm ci && npm run dev &
    #     sleep 5
    # - name: Run UI Tests
    #   run: |
    #     cd automation
    #     pytest ui_tests/tests/ --alluredir=allure-results

    - name: Generate Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: automation/allure-results
        allure_history: allure-history

    - name: Deploy report to Github Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history
